<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register for Coding Conf 2026 and generate your ticket.">
  <title>Coding Conf 2026 | Register</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-register">

  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="stars" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Coding Conf home">
        <img src="../assets/logo-mark.svg" alt="" width="32" height="32">
        <span>Coding Conf</span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#schedule">Schedule</a></li>
          <li><a href="login.html" aria-current="page">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="register" aria-labelledby="register-title">
      <div class="container narrow">

        <!-- Step indicator: 1 = details, 2 = ticket -->
        <ol class="steps" aria-label="Registration progress">
          <li class="is-active" aria-current="step">Your details</li>
          <li>Your ticket</li>
        </ol>

        <h1 id="register-title">
          Get your <span class="gradient-text">ticket</span>
        </h1>
        <p class="hero-lead">Fields marked <span aria-hidden="true">*</span><span class="visually-hidden">with an asterisk</span> are required.</p>

        <!-- Summary box, filled by validation.js when the form has errors -->
        <div id="form-summary" class="form-summary" role="alert" tabindex="-1" hidden></div>

        <!-- novalidate: the checks are done in validation.js instead of browser pop ups -->
        <form id="register-form" class="register-form" novalidate>

          <!-- Avatar upload -->
          <div class="field">
            <span class="label" id="avatar-label">Upload avatar <span aria-hidden="true">*</span></span>

            <div class="drop-zone" id="drop-zone">
              <input type="file" id="avatar" name="avatar"
                     accept="image/jpeg, image/png"
                     aria-labelledby="avatar-label"
                     aria-describedby="avatar-hint avatar-error">

              <!-- Shown before a file is picked -->
              <label for="avatar" class="drop-empty" id="drop-empty">
                <img src="../assets/icon-upload.svg" alt="" width="30" height="30">
                <span>Drag and drop or <u>click to upload</u></span>
              </label>

              <!-- Shown after a file is picked -->
              <div class="drop-filled" id="drop-filled" hidden>
                <img id="avatar-preview" src="" alt="Preview of your uploaded avatar" width="64" height="64">
                <div class="drop-actions">
                  <button type="button" class="btn-ghost" id="remove-avatar">Remove image</button>
                  <button type="button" class="btn-ghost" id="change-avatar">Change image</button>
                </div>
              </div>
            </div>

            <p class="hint" id="avatar-hint">
              <img src="../assets/icon-info.svg" alt="" width="16" height="16">
              JPG or PNG, max size 500KB.
            </p>
            <p class="error" id="avatar-error" aria-live="polite"></p>
          </div>

          <!-- Full name -->
          <div class="field">
            <label for="full-name" class="label">Full name <span aria-hidden="true">*</span></label>
            <input type="text" id="full-name" name="fullName"
                   autocomplete="name" placeholder="e.g. Shanice Brown"
                   aria-describedby="name-error" aria-required="true">
            <p class="error" id="name-error" aria-live="polite"></p>
          </div>

          <!-- Email -->
          <div class="field">
            <label for="email" class="label">Email address <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email"
                   autocomplete="email" placeholder="example@email.com"
                   aria-describedby="email-error" aria-required="true">
            <p class="error" id="email-error" aria-live="polite"></p>
          </div>

          <!-- GitHub -->
          <div class="field">
            <label for="github" class="label">GitHub username <span aria-hidden="true">*</span></label>
            <input type="text" id="github" name="github"
                   autocomplete="off" autocapitalize="none" spellcheck="false"
                   placeholder="@yourusername"
                   aria-describedby="github-error" aria-required="true">
            <p class="error" id="github-error" aria-live="polite"></p>
          </div>

          <button type="submit" class="btn btn-block" id="submit-btn">Generate My Ticket</button>
        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Coding Conf &middot; Papine, Kingston, Jamaica</p>
      <p><a href="index.html">Back to home</a></p>
    </div>
  </footer>

  <script src="../js/validation.js"></script>
</body>
</html>
